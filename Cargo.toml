[package]
name = "expression"
version = "0.1.0"
edition = "2024"

[dependencies]
dhat = "0.3.3"
fast-float2 = "0.2"
zmij = "1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[features]
dhat-heap = []

[[bench]]
name = "bench"
harness = false

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
panic = "abort"
