[package]
name = "expression"
version = "0.1.0"
edition = "2024"

[dependencies]
dhat = "0.3.3"
zmij      = "1"
fast-float2 = "0.2"
itoa = "1.0.18"

[profile.release]
opt-level = 3
lto = "thin"

[features]
dhat-heap=[]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "bench"
harness = false
